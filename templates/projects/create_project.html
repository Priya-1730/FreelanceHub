{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}
Create Project
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">

    <div class="col-md-8">

        <div class="card feature-card shadow-sm border-0">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Create New Project
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {% bootstrap_form form %}

                    <button type="submit"
                            class="btn btn-primary">
                        Create Project
                    </button>

                    <a href="{% url 'client_dashboard' %}"
                       class="btn btn-secondary">
                        Back to Dashboard
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
