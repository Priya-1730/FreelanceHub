{% extends 'base.html' %}

{% block title %}
Edit Profile - FreelanceHub
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="mb-4 text-center fw-bold">
                    Edit Profile
                </h2>

                <form method="POST">

                    {% csrf_token %}


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            <i class="bi bi-envelope"></i>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ user.email }}"
                            required>

                    </div>


                    <!-- Bio -->

                    <div class="mb-3">

                        <label class="form-label">
                            <i class="bi bi-person-lines-fill"></i>
                            Bio
                        </label>

                        <textarea
                            name="bio"
                            class="form-control"
                            rows="5"
                            placeholder="Tell us about yourself">{{ user.bio }}</textarea>

                    </div>


                    <!-- Skills — Freelancer only -->

                    {% if user.role == 'FREELANCER' %}

                        <div class="mb-3">

                            <label class="form-label">
                                <i class="bi bi-tools"></i>
                                Skills
                            </label>

                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                value="{{ user.skills }}"
                                placeholder="Python, Django, SQL, JavaScript">

                        </div>

                    {% endif %}


                    <!-- Buttons -->

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg"></i>
                        Save Profile

                    </button>

                    <a href="{% url 'profile' %}"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
